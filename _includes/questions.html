<div class="questions">{% for item in include.items %}<details><summary>{{ item.q }}<span aria-hidden="true" class="faq-icon">+</span></summary><div class="answer"><p>{{ item.a }}</p>{% if item.link %}<a class="text-link" href="{{ item.link }}" target="_blank" rel="noopener noreferrer">{{ item.label }}</a>{% elsif item.internal %}<a class="text-link" href="{% include link.html to=item.internal %}">{{ item.label }}</a>{% endif %}</div></details>{% endfor %}</div>
