<section class="hero wrap">
    <div class="hero-copy">
        <h1>Chris Staikos Psychotherapy</h1>
        <p class="hero-lead">{{ c.intro }}</p>
        <p>Psychotherapy for individuals, online and in person in Guelph, Ontario. In-person sessions are available on Thursdays at 161 Waterloo Avenue.</p>
        <div class="hero-actions">
            <a class="button" href="{% include link.html to='contact' %}"
                >Get in touch</a
            ><a class="text-link" href="{% include link.html to='about' %}"
                >Meet Chris</a
            >
        </div>
    </div>
    <figure class="hero-image">
        <img
            src="{{ '/assets/images/forest.jpg' | relative_url }}"
            alt="Soft light falling through a green forest"
            width="1800"
            height="1200"
            fetchpriority="high"
        />
    </figure>
</section>
