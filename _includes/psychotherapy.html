{% assign therapy = site.data.psychotherapy %}
<figure class="page-photo wrap therapy-photo">
    <img
        src="{{ '/assets/images/forest.jpg' | relative_url }}"
        alt="Soft sunlight filtering through a quiet evergreen forest"
        width="1800"
        height="1200"
    />
</figure>
<div class="therapy-content wrap">
    <div class="prose therapy-introduction">
        {{ therapy.approach | markdownify }}
    </div>
    {% for area in therapy.focus %}
        {% assign key = area.title | slugify %}
        <section class="therapy-focus-area" aria-labelledby="{{ key }}-heading">
            <h2 id="{{ key }}-heading">{{ area.title }}</h2>
            <div class="prose">
                {{ area.description | markdownify }}
            </div>
        </section>
    {% endfor %}
</div>
{% include invitation.html %}
