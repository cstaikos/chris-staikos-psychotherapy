intro: Bringing softness to rigid patterns and richness to life.
about:
  - Hi, I’m Chris. I live in Guelph, Ontario with my partner and our 4-year-old son. I am neurodivergent, queer, and drug- and sex-positive. I’ve come to psychotherapy after a decade writing software for companies of all sizes, from 4 to 25,000+ employees. I’ve come to see that real change in the world comes from the subtle internal shifts that drive behaviour — individually and collectively.
  - We all have aspects of our lives that aren’t working for us. Some of these patterns are so deeply ingrained, it’s easy to identify with them. I work with individuals to bring these patterns into focus, and to process the buried emotions that have kept them in place. Releasing these emotions can offer the spaciousness required for establishing new patterns in life.
  - My approach is relational, trauma informed, and grounded in present-moment awareness. I offer breathwork sessions for deeper processing, in an experiential model that is similar to psychedelic-assisted psychotherapy.
