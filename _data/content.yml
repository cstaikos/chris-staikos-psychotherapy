breathwork:
  - I work collaboratively with clients to assess whether breathwork would be appropriate for them. Often called Conscious Connected Breathwork, this involves using a specific breathing technique to produce changes in consciousness, allowing emotional material to be more easily accessible and processed. The model is similar to that used in psychedelic assisted psychotherapy and involves curated music, eye shades, intention setting, and integration work.
  - This is typically done in the context of a therapeutic relationship, allowing us to collaboratively identify stuck emotional patterns, bring them into awareness via breathwork, and continue processing via integration work afterwards.
breath_faq:
  - q: How do I know if breathwork is right for me?
    a: "The short answer is: let’s chat about it! There are some physiological and psychological readiness criteria, as well as some contraindications for participating in a breathwork session. I always facilitate breathwork sessions within a wider therapeutic relationship, working with each individual to determine if and when breathwork is appropriate for them."
  - q: Do you offer holotropic breathwork?
    a: No, the breathwork I offer is a gentle form of Conscious Connected Breathwork. This is shorter than holotropic breathwork tends to be, and with less of a focus on intensity.
  - q: Can I book a one-off breathwork session?
    a: "I offer breathwork in the context of an existing therapeutic relationship. At minimum, I would require: an initial consultation, one pre-breathwork preparation session, and one post-breathwork integration session. Depending on the individual, we may need to engage in more than one regular therapy session before moving into breathwork. This is in order to maximize benefits and minimize any risk of harm."
  - q: What are the risks involved in breathwork?
    a: Breathwork can bring uncomfortable emotions to the surface. Creating a safe container for this work is essential to ensure these emotions are tolerable. In addition to this, there are some contraindications for breathwork which you can read about in the resource below.
    link: https://unitybreathwork.com/breathwork-contraindications/
    label: Read about breathwork contraindications
  - q: How long does a breathwork session last?
    a: Three hours total. One hour involves preparation and discussion of intention, one hour is the actual breathwork, and one hour is dedicated to post-breathwork discussion. There are short breaks in between each section.
  - q: How much does a breathwork session cost?
    a: Breathwork sessions last 3 hours, and are charged at the regular hourly rate. My full fee is $150 per hour, and I offer limited spots on sliding scale pricing ($100 - $140 per hour). Note that I typically require at least one psychotherapy session prior to breathwork focused on intention setting, and one after breathwork focused on integration work.
faq:
  - q: Are your sessions in-person or remote?
    a: All of my client sessions, including breathwork, are held remotely via Zoom.
  - q: Do you work with clients across Canada?
    a: Yes, I work with clients across Canada as well as other countries. I adhere to each country's regulations and requirements for providing remote psychothearpy sessions.
  - q: Do you accept insurance?
    a: As a Registered Psychotherapist (Qualifying), my services are eligible to be reimbursed by many health insurance providers. Some providers list a single provider type "psychologist" which includes psychotherapy. If you are unsure, reach out to your insurance provider!
  - q: What are your fees?
    a: My full fee is $150 for a 60-minute session.
  - q: Do you offer sliding scale pricing?
    a: Yes, I have limited sliding scale spots available to help make therapy more accessible.
  - q: Do you offer free consultations?
    a: Yes! I offer free 20-minute consultation to get to know each other and determine if we are a good fit.
    link: https://aws-portal.owlpractice.ca/chris-staikos-psychotherapy/booking?therapist_id=1
    label: Book a free consultation
  - q: How often do you meet with your clients?
    a: I meet with clients weekly or bi-weekly.
  - q: What is breathwork?
    a: Conscious Connected Breathwork (CCB) is a specific form of breathing that can shift one’s state of consciousness. This can facilitate the processing of deep emotional material and help one to break out of old patterns.
    internal: breathwork
    label: More about breathwork
  - q: What are your hours?
    a: My regular client hours are 9am to 4pm, Monday, Tuesday, Thursday, and Friday. You can view my availability by visiting my booking page.
    link: https://aws-portal.owlpractice.ca/chris-staikos-psychotherapy/booking?therapist_id=1
    label: View availability
  - q: Do you offer psychedelic-assisted psychotherapy?
    a: Not at this time. I do, however, work with those who have chosen to engage with psychedelics — in a recreational, therapeutic, and/or spiritual context — and are seeking support in processing these experiences.
  - q: Can you refer me to an underground psychedelic therapist, or provide sources for psychedelic substances?
    a: No, I am not able to provide either of these services.
