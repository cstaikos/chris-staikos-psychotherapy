title: Chris Staikos Psychotherapy
description: Relational, trauma-informed psychotherapy with Chris Staikos, Registered Psychotherapist (Qualifying), in Canada.
lang: en-CA
url: 'https://www.chrisstaikos.com'
baseurl: ''
markdown: kramdown
permalink: pretty
exclude: [README.md, Gemfile, Gemfile.lock, scripts, tmp, vendor]
plugins: []
defaults:
  - scope:
      path: ''
    values:
      layout: site

# Set the final HTTPS url above for production indexing.
# Development builds remain noindex even when this is true.
search_indexing: true
# Paste only the content value from each service's HTML verification tag.
google_site_verification: ''
bing_site_verification: ''
